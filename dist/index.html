<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英语默写练习生成工具 - DictationSheet</title>
  <!-- 源码入口供 Vite 使用；直接双击时进入已经构建好的离线版本。 -->
  <script>
    if (
      window.location.protocol === 'file:' &&
      !/[\\/]dist[\\/]index\.html$/i.test(decodeURIComponent(window.location.pathname))
    ) {
      window.location.replace(new URL('./dist/index.html', window.location.href).href);
    }
  </script>
  <link rel="icon" type="image/png" href="./img/dictation-sheet-logo-CSZTT16Q.png" />
  <!-- 移动端首屏防闪烁：Vue 挂载前先标记设备类型。 -->
  <script>
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isMobileUA = /Android.*Mobile|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone/i.test(ua);
        var w = window.innerWidth || (document.documentElement && document.documentElement.clientWidth) || (window.screen && window.screen.width) || 0;
        if (isMobileUA || (w > 0 && w <= 768)) {
          document.documentElement.classList.add('is-mobile-device');
        }
      } catch (e) {}
    })();
  </script>
  <script defer src="./js/app-BPdsBv9N.js"></script>
  <link rel="stylesheet" href="./css/style-M9iX5SnC.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
